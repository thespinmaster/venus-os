<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | default: "Venus OS Addons" }}</title>

    <!-- Modern GitHub Markdown CSS (Includes automatic light/dark mode) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">

    <style>
			/* Outer body background matching GitHub's dark/light canvas */
      body {
        margin: 0;
        background-color: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0d1117;
        }
      }
			
      /* Simple page centering layout */
      .markdown-body {
        box-sizing: border-box;
        min-width: 200px;
        max-width: 980px;
        margin: 0 auto;
        padding: 45px;
      }
      @media (max-width: 767px) {
        .markdown-body { padding: 15px; }
      }
    </style>
  </head>
  <body>
    <article class="markdown-body">
      {{ content }}
    </article>
  </body>
</html>

- name: Build static feed dashboard
  run: |
    rm -rf public
    mkdir -p public

    cp -r feeds/* public/

    # Generate root landing page
    cat > public/index.html << 'EOF'
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>opkg Feed Repository</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    a { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>opkg Feed Repository</h1>
  <h2>Feeds</h2>
  <a href="release/main/">📦 Release</a>
  <a href="testing/main/">🧪 Testing</a>
</body>
</html>
EOF

    # Generate directory index pages (like http.server)
    find public -type d | while read dir; do
      if [ "$dir" = "public" ]; then continue; fi

      echo "Generating index for $dir"

      files=$(ls "$dir" 2>/dev/null || true)

      cat > "$dir/index.html" << EOF
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Index of $dir</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    a { display: block; margin: 4px 0; }
  </style>
</head>
<body>
  <h1>Index of $(basename "$dir")</h1>
  <a href="../">⬅ Parent</a>
EOF

      for f in $files; do
        [ "$f" = "index.html" ] && continue
        echo "<a href=\"$f\">$f</a>" >> "$dir/index.html"
      done

      echo "</body></html>" >> "$dir/index.html"
    done

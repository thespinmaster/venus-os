name: Publish opkg feeds to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - 'feeds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static opkg site
        run: |
          set -e

          rm -rf public
          mkdir -p public/feeds

          # Copy feeds exactly as-is
          cp -r feeds/* public/feeds/

          # -----------------------------
          # DIRECTORY INDEX GENERATION
          # -----------------------------
          html="$(cat <<'EOF'
          <html>
          <head>
            <meta charset='utf-8'>
            <title>Index</title>
            <style>
              body { font-family: monospace; }
              ul { padding: 0; list-style: none; }
              li { padding: 4px 0; }
              .name  { display:inline-block; width:40ch; }
              .mtime { display:inline-block; width:20ch; }
              .size  { display:inline-block; width:10ch; text-align:right; }
            </style>
          </head>
          EOF
          )"

          find public/feeds -type d | while read dir; do

            {
              echo "$html"
              echo "<body>"
              echo "  <h1>${dir#public/*}</h1>"
              echo "  <ul>"
              
              # -----------------------------
              # BACK LINK (if parent has index.html)
              # -----------------------------
              parent=$(dirname "$dir")
              if [ -f "$parent/index.html" ]; then
                echo "    <li><a href=\"../\">.. Parent Directory</a></li>"
              fi
              
              # -----------------------------
              # DIRECTORY CONTENTS
              # -----------------------------
              for f in "$dir"/*; do
                [ -e "$f" ] || continue
                name=$(basename "$f")
                [ "$name" = "index.html" ] && continue
                
                if [ -f "$f" ]; then
                  folder=""
                  size=$(stat -c %s "$f")
                  human_size=$(numfmt --to=iec --suffix=B "$size")
                else
                  folder="/"
                  human_size="-"
                fi
 
                # Modified time (YYYY-MM-DD HH:MM)
                mtime=$(stat -c %y "$f" | cut -d'.' -f1)
              
                echo "    <li><span class=\"name\"><a href=\"$name\">$name$folder</a></span> \
                      <span class=\"mtime\">$mtime</span> \
                      <span class=\"size\">$human_size</span></li>"
              done

              echo "  </ul>"
              echo "</body>"
              echo "</html>"
            } > "$dir/index.html"

          done

      - name: Deploy to gh-pages
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true

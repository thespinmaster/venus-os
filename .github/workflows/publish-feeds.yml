name: Publish opkg feeds to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'feeds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          set -e

          rm -rf public
          mkdir -p public/feeds

          # Copy feeds exactly as-is
          cp -r feeds/* public/feeds/

          # Root index page
          cat > public/index.html << 'EOF'
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>opkg Feed Repository</title>
</head>
<body>
  <h1>opkg Feed Repository</h1>

  <h2>Feeds</h2>
  <ul>
    <li><a href="feeds/">feeds</a></li>
  </ul>
</body>
</html>
EOF

      - name: Generate directory index files
        run: |
          set -e

          # Create index.html in EVERY directory under feeds
          find public/feeds -type d | while read dir; do

            rel=${dir#public/feeds/}

            cat > "$dir/index.html" << EOF
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>${rel:-feeds}</title>
</head>
<body>
  <h1>${rel:-feeds}</h1>
  <ul>
EOF

            for f in "$dir"/*; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              [ "$name" = "index.html" ] && continue
              echo "    <li><a href=\"$name\">$name</a></li>" >> "$dir/index.html"
            done

            echo "  </ul></body></html>" >> "$dir/index.html"
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true

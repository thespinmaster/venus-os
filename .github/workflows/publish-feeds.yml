on:
  push:
    branches:
      - main
  workflow_dispatch:
- name: Build and deploy opkg feeds to GitHub Pages
  run: |
    set -e

    rm -rf public
    mkdir -p public

    # Preserve full feeds structure under /feeds
    cp -r feeds public/feeds

    # Root landing page (fixes 404)
    cat > public/index.html << 'EOF'
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>opkg Feed Repository</title>
</head>
<body>
  <h1>opkg Feed Repository</h1>
  <h2>Feeds</h2>
  <ul>
EOF

    find public/feeds -mindepth 2 -maxdepth 2 -type d | while read d; do
      rel=${d#public/}
      echo "    <li><a href=\"/$rel/\">$rel</a></li>" >> public/index.html
    done

    cat >> public/index.html << 'EOF'
  </ul>
</body>
</html>
EOF

    # Deploy to gh-pages
    git config user.name "github-actions"
    git config user.email "github-actions@github.com"

    cd public
    git init
    git add .
    git commit -m "Deploy feeds"
    git branch -M gh-pages
    git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

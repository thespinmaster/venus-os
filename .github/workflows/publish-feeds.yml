name: Publish opkg feeds to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'feeds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          set -e

          rm -rf public
          mkdir -p public

          # Preserve feeds structure exactly
          cp -r feeds public/feeds

          # Root landing page (fixes 404)
          cat > public/index.html << 'EOF'
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>opkg Feed Repository</title>
</head>
<body>
  <h1>opkg Feed Repository</h1>
  <h2>Feeds</h2>
  <ul>
EOF

          # Dynamically list feeds (no hardcoding release/testing)
          find public/feeds -mindepth 2 -maxdepth 2 -type d | while read d; do
            rel=${d#public/}
            echo "    <li><a href=\"/$rel/\">$rel</a></li>" >> public/index.html
          done

          cat >> public/index.html << 'EOF'
  </ul>
</body>
</html>
EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true

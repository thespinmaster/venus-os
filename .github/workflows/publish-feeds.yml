name: Publish opkg feeds to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'feeds/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static opkg site
        run: |
          set -e

          rm -rf public
          mkdir -p public/feeds

          # Copy feeds EXACTLY as-is
          cp -r feeds/* public/feeds/

          # Create root landing page
          {
            echo "<!doctype html>"
            echo "<html>"
            echo "<head>"
            echo "  <meta charset='utf-8'>"
            echo "  <title>opkg Feed Repository</title>"
            echo "</head>"
            echo "<body>"
            echo "  <h1>opkg Feed Repository</h1>"
            echo "  <h2>Feeds</h2>"
            echo "  <ul>"

            for d in $(find public/feeds -mindepth 2 -maxdepth 2 -type d); do
              rel=${d#public/}
              echo "    <li><a href=\"/$rel/\">$rel</a></li>"
            done

            echo "  </ul>"
            echo "</body>"
            echo "</html>"
          } > public/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true

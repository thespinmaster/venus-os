name: Publish opkg feeds to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - 'feeds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static opkg site
        run: |
          set -e

          rm -rf public
          mkdir -p public/feeds

          # Copy feeds exactly as-is
          cp -r feeds/* public/feeds/

          # -----------------------------
          # DIRECTORY INDEX GENERATION
          # -----------------------------
          find public/feeds -type d | while read dir; do

            {
              echo "<!doctype html>"
              echo "<html>"
              echo "<head>"
              echo "  <meta charset='utf-8'>"
              echo "  <title>Index</title>"
              echo "</head>"
              echo "<body>"
              echo "  <h1>${dir#public/feeds/}</h1>"
              echo "  <ul>"
              
              # -----------------------------
              # BACK LINK (if parent has index.html)
              # -----------------------------
              parent=$(dirname "$dir")
              if [ -f "$parent/index.html" ]; then
                echo "    <li><a href=\"../\">.. Parent Directory</a></li>"
              fi
          
              # -----------------------------
              # DIRECTORY CONTENTS
              # -----------------------------
              for f in "$dir"/*; do
                [ -e "$f" ] || continue
                name=$(basename "$f")
                [ "$name" = "index.html" ] && continue
                echo "    <li><a href=\"$name\">$name/</a></li>"
              done

              echo "  </ul>"
              echo "</body>"
              echo "</html>"
            } > "$dir/index.html"

          done

      - name: Deploy to gh-pages
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true

name: Publish opkg feeds to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'feeds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build site
        run: |
          set -e

          rm -rf public
          mkdir -p public

          # KEEP structure EXACTLY
          cp -r feeds public/feeds

          # Root index
          cat > public/index.html << 'EOF'
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>opkg Feed Repository</title>
</head>
<body>
  <h1>opkg Feed Repository</h1>

  <ul>
    <li><a href="feeds/release/main/">release</a></li>
    <li><a href="feeds/testing/main/">testing</a></li>
  </ul>
</body>
</html>
EOF

      - name: Deploy to gh-pages (IMPORTANT FIX)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          keep_files: false
          force_orphan: true

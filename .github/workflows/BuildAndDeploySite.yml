name: Build and Deploy (Jekyll + Feeds)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. BUILD FEEDS FIRST
      - name: Build feeds
        run: |
          chmod +x scripts/build-feeds.sh || true
          scripts/build-feeds.sh
    
      # 2. SETUP JEKYLL
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
    
      - name: Install dependencies
        run: bundle install
    
      # 3. BUILD SITE
      - name: Build Jekyll site
        run: bundle exec jekyll build -d _site
    
      # 4. COPY FEEDS INTO FINAL SITE (CRITICAL FIX)
      - name: Inject feeds into site
        run: |
          mkdir -p _site/feeds
          cp -r feeds/* _site/feeds/
      # 5. UPLOAD
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

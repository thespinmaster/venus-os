name: Build and Deploy GitHub Pages (Jekyll + Feeds)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # 1. BUILD OPKG FEEDS
      # -------------------------
      - name: Build opkg feeds
        run: |
          chmod +x ./your-feed-script.sh || true
          ./your-feed-script.sh

          mkdir -p _site/feeds
          cp -r feeds/* _site/feeds/ || true

      # -------------------------
      # 2. SETUP JEKYLL
      # -------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      # -------------------------
      # 3. BUILD JEKYLL SITE
      # -------------------------
      - name: Build Jekyll site
        run: bundle exec jekyll build -d _site

      # -------------------------
      # 4. ENSURE FEEDS ARE INCLUDED
      # -------------------------
      - name: Inject feeds into site
        run: |
          mkdir -p _site/feeds
          cp -r feeds/* _site/feeds/ || true

      # -------------------------
      # 5. UPLOAD ARTIFACT
      # -------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
